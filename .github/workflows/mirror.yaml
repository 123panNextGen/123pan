name: Mirror to Codeberg

on:
  push:
    branches:
      - "**"

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Push to Codeberg
        run: |
          git remote add codeberg https://x-access-token:${{ secrets.CODEBERG_TOKEN }}@codeberg.org/123pannextgen/123pan.git
          git push --mirror codeberg