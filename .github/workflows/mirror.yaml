name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    name: Mirror to Codeberg
    runs-on: ubuntu-latest

    steps:
      - name: Mirror GitHub to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git clone --mirror \
            "https://github.com/${{ github.repository }}.git" \
            repo

          cd repo

          git push -f --prune \
            "https://x-access-token:${CODEBERG_TOKEN}@codeberg.org/123pannextgen/123pan.git" \
            "refs/heads/*:refs/heads/*" \
            "refs/tags/*:refs/tags/*"