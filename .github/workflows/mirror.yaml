name: Mirror to Codeberg

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository as mirror
        run: |
          git clone --mirror \
            "https://github.com/${{ github.repository }}.git" \
            repo.git

      - name: Push mirror to Codeberg
        working-directory: repo.git
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        run: |
          git remote add codeberg \
            "https://x-access-token:${CODEBERG_TOKEN}@codeberg.org/123pannextgen/123pan.git"

          git push --mirror codeberg