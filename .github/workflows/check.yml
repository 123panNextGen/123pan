name: check.yml
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            arch: x64
            python_arch: x64
          - os: ubuntu-24.04
            arch: x64
            python_arch: x64
          - os: macos-26
            arch: arm64
            python_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          architecture: ${{ matrix.python_arch }}

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            zip \
            clang \
            ccache

      - name: Install dependencies
        env:
          UV_INDEX_URL: https://pypi.org/simple
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          uv sync --group build --group test --group lint

      - name: Check
        run: |
          bash ./script/test.sh && echo && bash script/lint.sh src/
        shell: bash
