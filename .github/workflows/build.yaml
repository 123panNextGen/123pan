name: Build & Release 123pan

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号 (例如: v3.0.3)"
        required: true
        type: string
      prerelease:
        description: "是否为预发布版本"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            arch: x64      
            python_arch: x64
          - os: windows-11-vs2026-arm
            arch: arm64
            python_arch: arm64
          - os: ubuntu-24.04
            arch: x64
            python_arch: x64
          - os: ubuntu-24.04-arm
            arch: arm64
            python_arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python_arch }}

      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            zip \
            clang \
            ccache

      - name: Install dependencies
        env:
          UV_INDEX_URL: https://pypi.org/simple
          UV_HTTP_TIMEOUT: "120"
          UV_HTTP_RETRIES: "5"
        run: |
          uv sync --group build --group lint

      - name: Build with Nuitka
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: |
          bash script/build.sh
        shell: bash

      - name: Package Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $suffix = "${{ matrix.arch }}"
          Compress-Archive `
            -Path "123pan.dist" `
            -DestinationPath "123pan-windows-$suffix.zip" `
            -CompressionLevel Optimal `
            -Force

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: |
          zip -9 -r "123pan-linux-${{ matrix.arch }}.zip" 123pan.dist

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: 123pan-windows-${{ matrix.arch }}
          path: 123pan-windows-${{ matrix.arch }}.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: 123pan-linux-${{ matrix.arch }}
          path: 123pan-linux-${{ matrix.arch }}.zip

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: 123pan-windows-x64
          path: ./artifacts/windows-x64

      - name: Download Windows arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: 123pan-windows-arm64
          path: ./artifacts/windows-arm64

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: 123pan-linux-x64
          path: ./artifacts/linux-x64

      - name: Download Linux arm64 artifact
        uses: actions/download-artifact@v8
        with:
          name: 123pan-linux-arm64
          path: ./artifacts/linux-arm64

      - name: Set version for manual trigger
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV

      - name: Set version for push trigger
        if: github.event_name == 'push'
        run: |
          echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: |
            ./artifacts/windows-x64/123pan-windows-x64.zip
            ./artifacts/windows-arm64/123pan-windows-arm64.zip
            ./artifacts/linux-x64/123pan-linux-x64.zip
            ./artifacts/linux-arm64/123pan-linux-arm64.zip
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: false